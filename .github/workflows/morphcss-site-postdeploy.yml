# MorphCSS public site post-deployment verification — public metadata/hashes only
# Copyright (c) 2026 Jacek Kukulski
name: MorphCSS website post-deploy audit
on:
  push:
    branches: ['qa/morphcss-site-postdeploy-2026-10-16']
    paths: ['.github/workflows/morphcss-site-postdeploy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live alpha.1 pages, SEO and static assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 - <<'PY'
          import hashlib, json, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          ROOT='https://morphcss.site'
          RELEASE='v0.1.0-alpha.1'
          RELEASE_URL='https://github.com/sower666/morphcss-community/releases/download/v0.1.0-alpha.1/MorphCSS-Community-0.1.0-alpha.1.zip'
          RELEASE_SHA='32b3011791df651e343eeb619562553afef419a96decb3c705414d65c47d9101'
          OG='/assets/social-card.230e2b83e0b4fd7a.png'
          PAGES={
            '/':('4bf84c9f923dd9259050024d8e55e6e91fcb699e32d101b51a7cdc6cedc981c7',[RELEASE,'/community/']),
            '/community/':('dc27c8a49e17941472753ffe6d99196077b123f2c8074f63db89bed9e7a5e40f',[RELEASE,RELEASE_URL,RELEASE_SHA,'m-control']),
            '/docs/':('4e2312789ebe530f0f21770515d229ac695839b64ad270d91f82820093623ef5',[RELEASE,'m-control','m-field',RELEASE_SHA]),
            '/license/':('6796d3274bef40c2fbd8127b9bca5bb255f687daade1746a3e00c4d7275fdcdb',[RELEASE,'MorphCSS Community License 1.0'])
          }
          ASSETS={
            '/assets/site.881e42f865188d07.css':'881e42f865188d0768cb149047066fd54d39f870dbdd7966a1110e21ffacaf08',
            '/assets/site.e4e483b0d3d75944.js':'e4e483b0d3d7594448f6c47ff8d3daa465fb0cb0cbf2ac3c400892b7efb201cf',
            OG:'230e2b83e0b4fd7a8f58640d14fe5c5e3504f60a57aa5f365ef2510e96b1e78e',
          }
          OTHER=['/robots.txt','/sitemap.xml','/examples/','/reference/catalog/','/reference/content-portal/','/reference/dashboard/']
          class HeadParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.metas={}
                  self.links=[]
                  self.jsonld=[]
                  self.collect=False
                  self.payload=''
                  self.title=''
                  self.in_title=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta':
                      self.metas[a.get('name') or a.get('property')]=a.get('content','')
                  if tag=='link': self.links.append(a)
                  if tag=='title': self.in_title=True
                  if tag=='script' and a.get('type')=='application/ld+json':
                      self.collect=True
                      self.payload=''
              def handle_data(self,data):
                  if self.collect: self.payload+=data
                  if self.in_title: self.title+=data
              def handle_endtag(self,tag):
                  if tag=='title': self.in_title=False
                  if tag=='script' and self.collect:
                      self.jsonld.append(json.loads(self.payload))
                      self.collect=False

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'MorphCSS-postdeploy-QA/1.1','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req,timeout=22) as r:
                  return r.status,r.url,dict(r.headers.items()),r.read(5000000)
          results=[]
          for path in list(PAGES)+list(ASSETS)+OTHER:
              record={'path':path,'url':ROOT+path}
              for attempt in range(3):
                  try:
                      status,final,headers,body=fetch(ROOT+path)
                      record.update(http_status=status,final_url=final,bytes=len(body),
                                    sha256=hashlib.sha256(body).hexdigest(),
                                    csp_present=bool(headers.get('Content-Security-Policy')),
                                    hsts_present=bool(headers.get('Strict-Transport-Security')),
                                    cache_control=headers.get('Cache-Control',''))
                      problems=[]
                      if status!=200: problems.append('HTTP non-200')
                      if not final.startswith(ROOT): problems.append('unexpected redirect')
                      if path in PAGES:
                          expected,markers=PAGES[path]
                          if record['sha256']!=expected: problems.append('wrong HTML SHA-256')
                          html=body.decode('utf-8')
                          if 'v0.1.0-alpha.0' in html: problems.append('obsolete alpha.0 version')
                          for marker in markers:
                              if marker not in html: problems.append('missing '+marker[:70])
                          h=HeadParser()
                          h.feed(html)
                          if not h.title.strip(): problems.append('missing title')
                          if not h.metas.get('description'): problems.append('missing description')
                          if not h.metas.get('og:title'): problems.append('missing og:title')
                          if h.metas.get('og:image')!=ROOT+OG: problems.append('wrong og:image')
                          if h.metas.get('twitter:card')!='summary_large_image': problems.append('wrong Twitter card')
                          if h.metas.get('robots','').startswith('noindex'): problems.append('unexpected noindex')
                          if not any(x.get('rel')=='canonical' and x.get('href')==ROOT+path for x in h.links): problems.append('wrong canonical')
                          if not h.jsonld: problems.append('missing JSON-LD')
                          record['jsonld_blocks']=len(h.jsonld)
                          if not record['csp_present']: problems.append('missing CSP')
                          if not record['hsts_present']: problems.append('missing HSTS')
                      if path in ASSETS and record['sha256']!=ASSETS[path]: problems.append('wrong asset SHA-256')
                      if not body: problems.append('empty response')
                      record['problems']=problems
                      record['success']=not problems
                      break
                  except Exception as exc:
                      record['error']=str(exc)
                      if attempt<2: time.sleep(2)
              if 'success' not in record: record['success']=False
              print(('PASS' if record['success'] else 'FAIL'),path,
                    record.get('http_status','n/a'),record.get('problems',record.get('error','')))
              results.append(record)
          report={'deployment':'site.community-alpha1-2026-10-16.1',
                  'checked_at_utc':datetime.now(timezone.utc).isoformat(),
                  'results':results,
                  'checks_passed':sum(r['success'] for r in results),
                  'checks_total':len(results),
                  'all_pass':all(r['success'] for r in results)}
          with open('audit/site-postdeploy-alpha1.json','w') as out:
              json.dump(report,out,indent=2)
          print('RESULT',report['checks_passed'],'/',report['checks_total'],'PASS')
          if not report['all_pass']: raise SystemExit(1)
          PY
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphcss-site-alpha1-postdeploy-report
          path: audit/site-postdeploy-alpha1.json
          if-no-files-found: error
          retention-days: 14
